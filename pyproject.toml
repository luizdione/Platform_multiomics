[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omica"
version = "0.1.0"
description = "Plataforma localhost unificada de ômicas (genômica, epigenômica, transcriptômica) — IFRJ"
requires-python = ">=3.11"
# Faixas declaradas AQUI (único lugar); o lock pinado para os containers é o
# requirements.txt, gerado a partir destas faixas.
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "psutil>=5.9",
    "redis>=5,<6",
    "rq>=1.15,<2",
    "markdown>=3.5,<4",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["omica*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: pipelines de módulo sobre demo_data (critério de entrada de script migrado)"]
