name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pacote (faixas do pyproject)
        run: pip install -e ".[test]"
      - name: Testes (inclui validação de manifests e referências)
        run: pytest -q
        env:
          OMICA_DATA: /tmp/omica_ci
          GENOME_DATA: /tmp
          SKILLS_DIR: /tmp/skills_inexistente
