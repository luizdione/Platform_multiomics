<!DOCTYPE html>
<html lang="{{ 'pt-BR' if lang == 'pt' else 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}ômica{% endblock %}</title>
  <link rel="stylesheet" href="/static/omica.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="/?lang={{ lang }}">🧬 <strong>ômica</strong></a>
    <nav>
      <a href="/?lang={{ lang }}">{{ t('nav_inicio', lang) }}</a>
      <a href="/jobs?lang={{ lang }}">{{ t('nav_jobs', lang) }}</a>
      <a href="/ajuda?lang={{ lang }}">{{ t('nav_ajuda', lang) }}</a>
    </nav>
    <div class="idiomas">
      <a href="?lang=pt" class="{{ 'ativo' if lang == 'pt' }}">PT</a> ·
      <a href="?lang=en" class="{{ 'ativo' if lang == 'en' }}">EN</a>
    </div>
  </header>
  <main>
    {% block conteudo %}{% endblock %}
  </main>
  <footer class="rodape">
    <span>{{ t('versao', lang) }} {{ versao }}</span> — {{ t('rodape', lang) }}
  </footer>
</body>
</html>
