# Plataforma ômica — localhost :8710
# Config única: o compose lê o .env da raiz (OMICA_PORT, GENOME_DATA, SKILLS_DIR...).
# Redis fica SEM porta no host (rede interna) para não colidir com o redis do bonder.
name: omica

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: omica-web
    container_name: omica-web
    ports:
      # Padrão: só a própria máquina. Antes era 0.0.0.0 (UI sem autenticação exposta na
      # LAN). Para aula pela rede: OMICA_BIND=0.0.0.0 no .env, conscientemente.
      - "${OMICA_BIND:-127.0.0.1}:${OMICA_PORT:-8710}:8710"
    environment:
      OMICA_IN_DOCKER: "1"
      # X6 (F6): sem .pyc no repositório montado em /app (o worker gravava __pycache__
      # cpython-310..313 em modules/*/scripts)
      PYTHONDONTWRITEBYTECODE: "1"
      OMICA_PORT: "8710"
      OMICA_DATA: /data/omica
      GENOME_DATA: /data
      SKILLS_DIR: /skills
      OMICA_REDIS_URL: redis://omica-redis:6379/0
      OMICA_MAX_RAM_GB: "${OMICA_MAX_RAM_GB:-24}"
      # OMICA_API_TOKEN NÃO entra aqui de propósito: em `environment:` ele aparece no
      # `docker inspect`. O app lê do /app/.env montado (omica/config.py).
    volumes:
      - ./:/app
      - "${GENOME_DATA:-E:/data}:/data"
      # raiz de REFERÊNCIA (runs da genômica leem o BCF sem cópia) SOMENTE LEITURA, por cima
      # do /data rw: nenhum container da omica escreve nela (crítica F5 #3). O :ro NÃO protege
      # contra o host: o supervisor da madrugada relança o gtonly_1000bg.sh, que troca o .bcf
      # — nunca deixe *-Run8-TAUIND-public.vcf.gz nessa pasta com run ativo. Cada raiz de
      # OMICA_RAIZES_REFERENCIA (padrão: 1000bg_vcf) precisa de um bind :ro como este.
      - "${GENOME_DATA:-E:/data}/1000bg_vcf:/data/1000bg_vcf:ro"
      - "${SKILLS_DIR:-C:/Users/luizd/.claude/skills_bioinfo}:/skills:ro"
      # interruptor da GPU do autor, só leitura (portão das chamadas a LLM local)
      - "${OLLAMA_DELEGATE_DIR:-C:/Users/luizd/.ollama_delegate}:/gpu_switch:ro"
    networks:
      # `default` explícito: sem ele o web perde o Redis (omica_default).
      - default
      # rede interna compartilhada SÓ com o n8n — ele alcança http://omica-web:8710
      # sem enxergar o Redis (sem senha) nem os workers. Criada fora deste compose por
      # C:\github\n8n-infra\scripts\garantir_rede.ps1.
      - omica_api
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: omica-web
    container_name: omica-worker
    command: rq worker omica --url redis://omica-redis:6379/0
    environment:
      OMICA_IN_DOCKER: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMICA_DATA: /data/omica
      GENOME_DATA: /data
      SKILLS_DIR: /skills
      OMICA_REDIS_URL: redis://omica-redis:6379/0
      OMICA_MAX_RAM_GB: "${OMICA_MAX_RAM_GB:-24}"
    volumes:
      - ./:/app
      - "${GENOME_DATA:-E:/data}:/data"
      # raiz de referência só leitura (ver o serviço web)
      - "${GENOME_DATA:-E:/data}/1000bg_vcf:/data/1000bg_vcf:ro"
      - "${SKILLS_DIR:-C:/Users/luizd/.claude/skills_bioinfo}:/skills:ro"
    depends_on:
      - redis
    restart: unless-stopped

  worker-bioinfo:
    build:
      context: .
      dockerfile: docker/Dockerfile.bioinfo
    image: omica-bioinfo
    container_name: omica-worker-bioinfo
    environment:
      OMICA_IN_DOCKER: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMICA_DATA: /data/omica
      GENOME_DATA: /data
      OMICA_REDIS_URL: redis://omica-redis:6379/0
      OMICA_MAX_RAM_GB: "${OMICA_MAX_RAM_GB:-24}"
    volumes:
      - ./:/app
      - "${GENOME_DATA:-E:/data}:/data"
      # raiz de referência só leitura (ver o serviço web)
      - "${GENOME_DATA:-E:/data}/1000bg_vcf:/data/1000bg_vcf:ro"
    depends_on:
      - redis
    restart: unless-stopped

  worker-vep:
    build:
      context: .
      dockerfile: docker/Dockerfile.vep
    image: omica-vep
    container_name: omica-worker-vep
    environment:
      OMICA_IN_DOCKER: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMICA_DATA: /data/omica
      GENOME_DATA: /data
      OMICA_REDIS_URL: redis://omica-redis:6379/0
      OMICA_MAX_RAM_GB: "${OMICA_MAX_RAM_GB:-24}"
    volumes:
      - ./:/app
      - "${GENOME_DATA:-E:/data}:/data"
      # raiz de referência só leitura (ver o serviço web)
      - "${GENOME_DATA:-E:/data}/1000bg_vcf:/data/1000bg_vcf:ro"
    depends_on:
      - redis
    restart: unless-stopped

  worker-methyl:
    build:
      context: .
      dockerfile: docker/Dockerfile.methyl
    image: omica-methyl
    container_name: omica-worker-methyl
    environment:
      OMICA_IN_DOCKER: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMICA_DATA: /data/omica
      GENOME_DATA: /data
      OMICA_REDIS_URL: redis://omica-redis:6379/0
      OMICA_MAX_RAM_GB: "${OMICA_MAX_RAM_GB:-24}"
      R_LIBS_USER: /rlib
    volumes:
      - ./:/app
      - "${GENOME_DATA:-E:/data}:/data"
      # raiz de referência só leitura (ver o serviço web)
      - "${GENOME_DATA:-E:/data}/1000bg_vcf:/data/1000bg_vcf:ro"
      - epigenoma_r_lib:/rlib
    depends_on:
      - redis
    restart: unless-stopped

  worker-ml:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    image: omica-ml
    container_name: omica-worker-ml
    environment:
      OMICA_IN_DOCKER: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMICA_DATA: /data/omica
      GENOME_DATA: /data
      OMICA_REDIS_URL: redis://omica-redis:6379/0
      OMICA_MAX_RAM_GB: "${OMICA_MAX_RAM_GB:-24}"
    volumes:
      - ./:/app
      - "${GENOME_DATA:-E:/data}:/data"
      # raiz de referência só leitura (ver o serviço web)
      - "${GENOME_DATA:-E:/data}/1000bg_vcf:/data/1000bg_vcf:ro"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: omica-redis
    restart: unless-stopped

volumes:
  epigenoma_r_lib:
    external: true  # bibliotecas R compiladas pela plataforma antiga — reuso

networks:
  # Criada FORA deste compose (n8n-infra\scripts\garantir_rede.ps1): um `docker compose
  # down` aqui não pode apagá-la — o `docker start n8n` do scijournal passaria a falhar.
  omica_api:
    external: true
