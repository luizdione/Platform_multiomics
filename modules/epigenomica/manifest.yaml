# Módulo Epigenômica — manifest (Fase 3, migração curada da epigenome_platform
# congelada). Fila "methyl": worker = rocker/rstudio:4.2 + volume epigenoma_r_lib
# (bibliotecas R JÁ COMPILADAS pela plataforma antiga — reuso, zero build
# Bioconductor). Demo REAL versionado: 6 coverages Bismark CD4 (3 Nelore × 3
# Holstein) do depósito Zenodo do próprio paper. PAINEL 108 VERSIONADO em
# data/paineis/ com proveniência — fim das contagens divergentes (45/49/53).
id: epigenomica
nome_pt: Epigenômica
nome_en: Epigenomics
icone: "🧭"
ordem: 2
descricao_pt: >-
  Metilação comparativa (RRBS/WGBS) indicino × taurino: DMCs (methylKit), interseção
  com o painel 108 versionado, metaperfis TSS e (nas próximas levas) HOMER e MOFA2.
descricao_en: >-
  Comparative methylation (RRBS/WGBS) indicine × taurine: DMCs (methylKit),
  intersection with the versioned 108-gene panel, TSS metaprofiles; HOMER/MOFA2 next.
# Domínios da biblioteca de skills que este módulo cobre (elo com /skills e com o
# plugin Bioinfo): quem procura receita nesses domínios é avisado de que há análise
# pronta aqui.
skills_dominios: [epigenomics, multiomics]
fases:
  - id: epi_fase1
    nome: Fase 1 · Metilação diferencial
    descricao: Coverages Bismark → DMCs (methylKit, |diff|>15%, q<0,05, BH).
    etapas:
      - key: painel_108
        desc: Painel 108 versionado (data/paineis/painel_108.json+bed, proveniência TableS1 curada)
        auto: false
        status_type: concluido
      - key: dmcs_methylkit
        desc: DMCs com methylKit no worker omica-methyl (R libs do volume epigenoma_r_lib)
        auto: true
        status_type: concluido
  - id: epi_fase2
    nome: Fase 2 · Interseção e perfis
    descricao: DMC × painel 108 e metaperfil de metilação ao redor do TSS.
    etapas:
      - key: intersecao_dmc
        desc: Interseção DMC × janelas ±15 kb do painel 108 (Python puro, rótulo honesto)
        auto: true
        status_type: concluido
      - key: perfis_tss
        desc: Metaperfil de metilação ±2 kb do TSS por grupo (numpy/matplotlib)
        auto: true
        status_type: concluido
      - key: motifs_homer
        desc: HOMER known motifs nas CpGs diferenciais (FASTA do SnpEff local; preparse persistente em refs)
        auto: true
        status_type: concluido
      - key: mofa2
        desc: MOFA promotor×corpo do painel 108 (mofapy2 entry_point direto — wrapper R aposentado após 4 incompatibilidades de época; com WGS+RRBS pareados a 2ª view vira genótipos)
        auto: true
        status_type: concluido
scripts:
  - key: dmc_demo
    titulo: "DMCs Nelore × Holstein (demo CD4)"
    descricao: >-
      methylKit sobre os 6 coverages reais versionados (3 Nelore × 3 HF, células
      CD4): CpGs comuns, teste por CpG e DMCs com |diff|>15%, q<0,05.
    runtime: "image:omica-methyl"
    cmd: >-
      Rscript modules/epigenomica/scripts/metilacao_dmc.R
      --dir {dir_cov} --grupo-a {grupo_a} --grupo-b {grupo_b}
      --min-cov {min_cov} --diff 15 --qvalue 0.05
      --saida {dados}/results/epigenomica/demo/dmc
    params:
      - {name: dir_cov, rotulo: "Diretório dos .cov.gz", default: "modules/epigenomica/demo_data"}
      - {name: grupo_a, rotulo: "Grupo A (padrão no nome do arquivo)", default: "Nelore"}
      - {name: grupo_b, rotulo: "Grupo B (padrão no nome do arquivo)", default: "HF"}
      - {name: min_cov, rotulo: "Cobertura mínima por CpG", default: "5"}
    inputs: ["modules/epigenomica/demo_data"]
    outputs: ["results/epigenomica/demo/dmc/dmc.tsv", "results/epigenomica/demo/dmc/todas_cpgs.tsv", "results/epigenomica/demo/dmc/dmc_resumo.json"]
    mem_gb: 3
    cpus: 1
    tempo_estimado: "~1 min"
  - key: intersecao_demo
    titulo: "Interseção DMC × painel 108"
    descricao: Conta DMCs (hiper/hipo) por janela ±15 kb de cada gene do painel versionado.
    runtime: "image:omica-methyl"
    cmd: >-
      python3 modules/epigenomica/scripts/intersecao_dmc_painel.py
      --dmc {dados}/results/epigenomica/demo/dmc/dmc.tsv
      --painel modules/epigenomica/data/paineis/painel_108.bed
      --saida {dados}/results/epigenomica/demo/intersecao
    inputs: ["results/epigenomica/demo/dmc/dmc.tsv", "modules/epigenomica/data/paineis/painel_108.bed"]
    outputs: ["results/epigenomica/demo/intersecao/intersecao.tsv", "results/epigenomica/demo/intersecao/intersecao_resumo.json"]
    mem_gb: 1
    cpus: 1
    tempo_estimado: "~10 s"
  - key: tss_demo
    titulo: "Metaperfil TSS (demo CD4)"
    descricao: Metilação média por bin ±2 kb do TSS dos 108 genes, Nelore vs Holstein.
    runtime: "image:omica-methyl"
    cmd: >-
      python3 modules/epigenomica/scripts/perfil_tss.py
      --dir {dir_cov} --painel modules/epigenomica/data/paineis/painel_108.json
      --grupo-a Nelore --grupo-b HF --janela 2000 --bin 100
      --saida {dados}/results/epigenomica/demo/tss
    params:
      - {name: dir_cov, rotulo: "Diretório dos .cov.gz", default: "modules/epigenomica/demo_data"}
    inputs: ["modules/epigenomica/demo_data", "modules/epigenomica/data/paineis/painel_108.json"]
    outputs: ["results/epigenomica/demo/tss/tss_perfil.png", "results/epigenomica/demo/tss/tss_resumo.json"]
    mem_gb: 1
    cpus: 1
    tempo_estimado: "~30 s"
  - key: motifs_homer_demo
    titulo: "Motifs de TF (HOMER, known)"
    descricao: >-
      Top CpGs diferenciais (limiar relaxado e declarado no demo) ±100 pb →
      HOMER known motifs contra o genoma bovino local.
    runtime: "image:omica-methyl"
    cmd: >-
      python3 modules/epigenomica/scripts/motifs_homer.py
      --cpgs {dados}/results/epigenomica/demo/dmc/todas_cpgs.tsv
      --q-max {q_max} --top-n {top_n} --flanco 100
      --saida {dados}/results/epigenomica/demo/motifs
    params:
      - {name: q_max, rotulo: "q máximo (relaxado p/ demo)", default: "0.25"}
      - {name: top_n, rotulo: "Top CpGs por |diff|", default: "200"}
    inputs: ["results/epigenomica/demo/dmc/todas_cpgs.tsv", "E:\\data\\snpeff_data\\ARS-UCD1.3.113\\sequences.fa"]
    outputs: ["results/epigenomica/demo/motifs/motifs_top.tsv", "results/epigenomica/demo/motifs/motifs_resumo.json"]
    mem_gb: 6
    cpus: 2
    tempo_estimado: "1ª vez ~15 min (preparse); depois 2–4 min"
  - key: mofa_preparar_demo
    titulo: "MOFA — preparar views (promotor × corpo)"
    descricao: Metilação média por gene do painel 108 em duas views reais pareadas por amostra.
    runtime: "image:omica-methyl"
    cmd: >-
      python3 modules/epigenomica/scripts/mofa_preparar.py
      --dir {dir_cov} --painel modules/epigenomica/data/paineis/painel_108.json
      --promotor 2000 --min-amostras 4
      --saida {dados}/results/epigenomica/demo/mofa/views
    params:
      - {name: dir_cov, rotulo: "Diretório dos .cov.gz", default: "modules/epigenomica/demo_data"}
    inputs: ["modules/epigenomica/demo_data", "modules/epigenomica/data/paineis/painel_108.json"]
    outputs: ["results/epigenomica/demo/mofa/views/view_promotor.tsv", "results/epigenomica/demo/mofa/views/view_corpo.tsv", "results/epigenomica/demo/mofa/views/views_resumo.json"]
    mem_gb: 1
    cpus: 1
    tempo_estimado: "~20 s"
  - key: mofa_rodar_demo
    titulo: "MOFA — fatores e variância explicada"
    descricao: >-
      mofapy2 (entry_point oficial, 3 fatores) sobre as views; R² por
      fator/view computado explicitamente; separa Nelore×HF no espaço de fatores.
    runtime: "image:omica-methyl"
    cmd: >-
      python3 modules/epigenomica/scripts/mofa_treinar.py
      --views {dados}/results/epigenomica/demo/mofa/views
      --fatores 3
      --saida {dados}/results/epigenomica/demo/mofa/modelo
    inputs: ["results/epigenomica/demo/mofa/views/view_promotor.tsv", "results/epigenomica/demo/mofa/views/view_corpo.tsv"]
    outputs: ["results/epigenomica/demo/mofa/modelo/mofa_resumo.json", "results/epigenomica/demo/mofa/modelo/variancia_explicada.tsv", "results/epigenomica/demo/mofa/modelo/mofa_fatores.png"]
    mem_gb: 3
    cpus: 1
    tempo_estimado: "~2 min"
workflows:
  - id: wf_mofa_demo
    titulo: "MOFA do painel 108 (promotor × corpo)"
    descricao: >-
      Preparação das duas views de metilação por gene → MOFA2 com 3 fatores e
      variância explicada por view.
    passos: [mofa_preparar_demo, mofa_rodar_demo]
    testado_em: "2026-10-06"
    testado_por: "Claude (fila methyl real, re-execução pós-auditoria; separação Nelore×HF = 1,25 no Fator 1)"
    hash_scripts: "89df0a07439b5f96"
    nota_didatica: >-
      MOFA é análise multi-view: aqui as views são promotor × corpo gênico
      (pareadas por amostra de verdade); com animais WGS+RRBS, uma view vira a
      matriz de genótipos e o fluxo é o mesmo.
  - id: wf_metilacao_demo
    titulo: "Da cobertura Bismark ao painel 108 (demo CD4)"
    descricao: >-
      DMCs Nelore×Holstein (methylKit) → interseção com as janelas ±15 kb do
      painel 108 versionado. O metaperfil TSS roda à parte sobre os mesmos dados.
    passos: [dmc_demo, intersecao_demo]
    testado_em: "2026-10-06"
    testado_por: "Claude (fila methyl real, depends_on: DMC → interseção; re-execução pós-auditoria: 275 DMCs, 229 no painel 108 em 43 genes, cada DMC contada uma vez)"
    hash_scripts: "ef8e5355bc92acc7"
    nota_didatica: >-
      Os coverages demo são dados REAIS do depósito Zenodo do paper (CD4,
      filtrados) — os mesmos limiares do manuscrito (|diff|>15%, q<0,05).
results_spec:
  "DMCs (resumo)": "epigenomica/demo/dmc/dmc_resumo.json"
  "DMCs (tabela)": "epigenomica/demo/dmc/dmc.tsv"
  "Interseção painel 108 (resumo)": "epigenomica/demo/intersecao/intersecao_resumo.json"
  "Interseção painel 108 (por gene)": "epigenomica/demo/intersecao/intersecao.tsv"
  "Metaperfil TSS (resumo)": "epigenomica/demo/tss/tss_resumo.json"
  "Metaperfil TSS (figura)": "epigenomica/demo/tss/tss_perfil.png"
  "Motifs HOMER (resumo)": "epigenomica/demo/motifs/motifs_resumo.json"
  "Motifs HOMER (top)": "epigenomica/demo/motifs/motifs_top.tsv"
  "MOFA views (resumo)": "epigenomica/demo/mofa/views/views_resumo.json"
  "MOFA (resumo)": "epigenomica/demo/mofa/modelo/mofa_resumo.json"
  "MOFA fatores (figura)": "epigenomica/demo/mofa/modelo/mofa_fatores.png"
