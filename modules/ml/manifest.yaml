# Módulo ML — manifest (Fase 5, migração curada do bovine_aim_gwas_ml_thermalcore).
# Agnóstico ao marcador: a mesma engrenagem classifica SNPs (0/1/2), CpGs ou
# genes — basta trocar a matriz. Demo REAL: genótipos Angus×Brahman do BCF Run 8
# (fila bioinfo monta o dataset; fila ml classifica — cadeia entre filas).
# Rótulos de raça corrigidos em 2026-10-19: o par Angus×Nelore (112×385) das versões
# anteriores usava listas inválidas; ver E:\data\1000bg_metadata\LEIA-ME_ROTULOS.md.
id: ml
nome_pt: Aprendizado de máquina
nome_en: Machine learning
icone: "🤖"
ordem: 4
descricao_pt: >-
  Classificação com CV aninhada (RF/XGBoost), métricas balanceadas, SHAP e
  painel mínimo sem vazamento — herança direta do pipeline do paper de AIMs,
  aplicável a qualquer matriz (SNP, CpG, expressão).
descricao_en: >-
  Nested-CV classification (RF/XGBoost), balanced metrics, SHAP and
  leakage-free minimal panels — inherited from the AIM paper pipeline,
  applicable to any marker matrix.
# Domínios da biblioteca de skills que este módulo cobre (elo com /skills e com o
# plugin Bioinfo): quem procura receita nesses domínios é avisado de que há análise
# pronta aqui.
skills_dominios: [stats-ml]
fases:
  - id: ml_fase1
    nome: Fase 1 · Dataset
    descricao: Matriz de marcadores × amostras com rótulos de grupo.
    etapas:
      - key: dataset_genotipos
        desc: Genótipos 0/1/2 do BCF real (MAF mínimo + afinamento) p/ Angus×Brahman
        auto: true
        status_type: concluido
  - id: ml_fase2
    nome: Fase 2 · Classificação e interpretação
    descricao: Nested CV (RF/XGBoost), SHAP, painel mínimo intra-fold.
    etapas:
      - key: nested_cv
        desc: CV aninhada 5×3 com métricas balanceadas (herdada do thermalcore)
        auto: true
        status_type: concluido
      - key: shap_painel
        desc: SHAP no modelo final + painel mínimo top-k sem vazamento
        auto: true
        status_type: concluido
      - key: robustez
        desc: Robustez A1/A2/A3 (bootstrap do painel, recorrência entre folds, IC95%) — herdada de A1A2A3_bootstrap_folds_ic.py
        auto: true
        status_type: concluido
scripts:
  - key: ml_dataset_demo
    titulo: "Dataset: genótipos Angus × Brahman (BTA14 demo)"
    descricao: >-
      Extrai genótipos 0/1/2 das amostras reais (Angus × Brahman) na região demo,
      com MAF mínimo e afinamento — a matriz de entrada do classificador.
    runtime: "image:omica-bioinfo"
    cmd: >-
      python3 modules/ml/scripts/ml_dataset_genotipos.py
      --vcf {vcf} --regiao {regiao}
      --grupo-a {grupo_a} --grupo-b {grupo_b}
      --maf {maf} --passo {passo}
      --saida {dados}/results/ml/demo/dataset
    params:
      - {name: vcf, rotulo: "VCF/BCF com genótipos", default: "/data/1000bg_vcf/Chr14-Run8-TAUIND-public.bcf", tipo: caminho}
      - {name: regiao, rotulo: "Região", default: "14:1-2500000", tipo: texto}
      - {name: grupo_a, rotulo: "Grupo A", default: "Angus=/data/1000bg_metadata/samples_angus.txt", tipo: grupo}
      - {name: grupo_b, rotulo: "Grupo B", default: "Brahman=/data/1000bg_metadata/samples_brahman.txt", tipo: grupo}
      - {name: maf, rotulo: "MAF mínimo", default: "0.2", tipo: decimal}
      - {name: passo, rotulo: "Afinamento (1 a cada N)", default: "15", tipo: inteiro}
    inputs: ["E:\\data\\1000bg_vcf", "E:\\data\\1000bg_metadata"]
    outputs: ["results/ml/demo/dataset/genotipos.tsv", "results/ml/demo/dataset/rotulos.tsv", "results/ml/demo/dataset/dataset_resumo.json"]
    mem_gb: 2
    cpus: 2
    tempo_estimado: "~2 min"
  - key: ml_classificar_demo
    titulo: "Classificar: nested CV + SHAP + painel mínimo"
    descricao: >-
      RF e XGBoost sob CV aninhada 5×3 com métricas balanceadas; SHAP ranqueia
      os marcadores e o painel mínimo é avaliado sem vazamento.
    runtime: "image:omica-ml"
    cmd: >-
      python3 modules/ml/scripts/ml_classificar.py
      --matriz {dados}/results/ml/demo/dataset/genotipos.tsv
      --rotulos {dados}/results/ml/demo/dataset/rotulos.tsv
      --k-painel {k_painel}
      --saida {dados}/results/ml/demo/classificacao
    params:
      - {name: k_painel, rotulo: "Tamanho do painel mínimo (top-k)", default: "50", tipo: inteiro}
    inputs: ["results/ml/demo/dataset/genotipos.tsv", "results/ml/demo/dataset/rotulos.tsv"]
    outputs: ["results/ml/demo/classificacao/ml_resumo.json", "results/ml/demo/classificacao/shap_top.tsv", "results/ml/demo/classificacao/shap_top.png"]
    mem_gb: 4
    cpus: 2
    tempo_estimado: "3–8 min"
  - key: ml_robustez_demo
    titulo: "Robustez do painel (A1/A2/A3)"
    descricao: >-
      Bootstrap de seleção (núcleo estável ≥80%), recorrência do top-k entre os
      5 folds externos e IC95% percentílico das métricas — as três respostas de
      parecer herdadas do thermalcore.
    runtime: "image:omica-ml"
    cmd: >-
      python3 modules/ml/scripts/ml_robustez.py
      --matriz {dados}/results/ml/demo/dataset/genotipos.tsv
      --rotulos {dados}/results/ml/demo/dataset/rotulos.tsv
      --k-painel {k_painel} --n-boot {n_boot}
      --saida {dados}/results/ml/demo/robustez
    params:
      - {name: k_painel, rotulo: "Tamanho do painel (top-k)", default: "50", tipo: inteiro}
      - {name: n_boot, rotulo: "Reamostragens bootstrap", default: "100", tipo: inteiro}
    inputs: ["results/ml/demo/dataset/genotipos.tsv", "results/ml/demo/dataset/rotulos.tsv"]
    outputs: ["results/ml/demo/robustez/robustez_resumo.json", "results/ml/demo/robustez/nucleo_estavel.tsv", "results/ml/demo/robustez/robustez.png"]
    mem_gb: 4
    cpus: 2
    tempo_estimado: "2–5 min"
workflows:
  - id: wf_ml_aims
    titulo: "Do BCF ao painel mínimo de AIMs (Angus × Brahman)"
    descricao: >-
      Extração de genótipos reais (fila bioinfo) → classificação com CV aninhada,
      SHAP e painel mínimo (fila ml) — cadeia entre filas especializadas.
    passos: [ml_dataset_demo, ml_classificar_demo]
    testado_em: "2026-10-19"
    testado_por: "Claude (re-execução pós-correção dos rótulos de raça; filas bioinfo→ml encadeadas; 157 amostras reais, 102 Angus × 55 Brahman, bal.acc 0,991 RF e 1,000 XGBoost no painel completo de 515 variantes)"
    hash_scripts: "9563a9c0e7dbc8de"
    nota_didatica: >-
      O mesmo desenho do paper de AIMs do autor: o painel mínimo é escolhido
      dentro de cada fold de treino, nunca olhando o conjunto todo — é assim que
      se evita o vazamento que infla acurácias. Taurino × indicino são
      subespécies: a separação é quase perfeita (bal.acc ≈ 1,0) por natureza do
      contraste, não por vazamento; entre raças da mesma subespécie o problema é
      bem mais difícil.
results_spec:
  "Dataset (resumo)": "ml/demo/dataset/dataset_resumo.json"
  "Classificação (resumo)": "ml/demo/classificacao/ml_resumo.json"
  "SHAP top marcadores (tabela)": "ml/demo/classificacao/shap_top.tsv"
  "SHAP top 20 (figura)": "ml/demo/classificacao/shap_top.png"
  "Robustez A1/A2/A3 (resumo)": "ml/demo/robustez/robustez_resumo.json"
  "Núcleo estável (tabela)": "ml/demo/robustez/nucleo_estavel.tsv"
  "Estabilidade bootstrap (figura)": "ml/demo/robustez/robustez.png"
