# Módulo Genômica — manifest (Fase 2 em migração curada da genomes_platform
# congelada). Scripts rodam na fila "bioinfo" (worker = imagem omica-bioinfo,
# sem docker.sock). Demo: fatia REAL do 1000 Bull Genomes Run 8 versionada em
# demo_data/ (BTA14:1-2.500.000, 122.372 variantes, sem genótipos — AF/AC/AN
# no INFO). Nenhum número científico vive aqui: a UI lê results_spec.
id: genomica
nome_pt: Genômica
nome_en: Genomics
icone: "🧬"
ordem: 1
descricao_pt: >-
  Variantes WGS (1000 Bull Genomes Run 8, ARS-UCD1.2), painéis de genes, anotação
  funcional (SnpEff/VEP), frequências alélicas, Fst e estrutura populacional.
descricao_en: >-
  WGS variants (1000 Bull Genomes Run 8, ARS-UCD1.2), gene panels, functional
  annotation (SnpEff/VEP), allele frequencies, Fst and population structure.
# Domínios da biblioteca de skills que este módulo cobre (elo com /skills e com o
# plugin Bioinfo): quem procura receita nesses domínios é avisado de que há análise
# pronta aqui.
skills_dominios: [variants-popgen, seq-tools]
fases:
  - id: gen_fase1
    nome: Fase 1 · Preparação de dados
    descricao: Coordenadas de genes (Ensembl), metadados de amostras, integridade dos VCFs.
    compartilhada: true
    etapas:
      - key: coordenadas_painel
        desc: "Painel de símbolos → BED via GTF local do SnpEff (Ensembl REST hoje é ARS-UCD2.0, incompatível — fonte corrigida em 2026-09-02)"
        auto: true
        status_type: concluido
      - key: integridade_vcf
        desc: "Integridade e índices dos VCFs/BCFs em E:\\data\\1000bg_vcf (legado: check_vcf_integrity.py)"
        auto: true
        status_type: concluido
  - id: gen_fase2
    nome: Fase 2 · Extração, anotação e frequências
    descricao: Extração por painel (bcftools -R), anotação SnpEff (ARS-UCD1.3.113) e frequências AF/MAF.
    etapas:
      - key: extracao_regioes
        desc: Extração de variantes por painel BED (bcftools na imagem omica-bioinfo)
        auto: true
        status_type: concluido
      - key: anotacao_snpeff
        desc: Anotação funcional SnpEff — banco ARS-UCD1.3.113 em E:\data\snpeff_data (bug /opt/snpEff corrigido)
        auto: true
        status_type: concluido
      - key: frequencias
        desc: Frequências alélicas AF/MAF via INFO
        auto: true
        status_type: concluido
      - key: fst_racas
        desc: Fst Hudson entre raças (plink2) com as listas reais de BioSamples (Angus×Nelore)
        auto: true
        status_type: concluido
      - key: vep
        desc: "Anotação VEP offline (release 110 pinado — o VEP atual usa ARS-UCD2.0, incompatível com o Run 8; cache local em refs/vep)"
        auto: true
        status_type: concluido
scripts:
  - key: extracao_demo
    titulo: "Extração por painel (demo BTA14)"
    descricao: >-
      Extrai as variantes das 3 janelas do painel demo (inclui a janela do DGAT1)
      a partir da fatia real do 1000 Bull Genomes versionada no repo.
    runtime: "image:omica-bioinfo"
    cmd: >-
      python3 modules/genomica/scripts/extracao_regioes.py
      --entrada modules/genomica/demo_data/demo_bta14_inicio.vcf.gz
      --bed modules/genomica/demo_data/painel_demo.bed
      --saida {dados}/results/genomica/demo/extracao
    inputs: ["modules/genomica/demo_data/demo_bta14_inicio.vcf.gz", "modules/genomica/demo_data/painel_demo.bed"]
    outputs: ["results/genomica/demo/extracao/extraido.vcf.gz", "results/genomica/demo/extracao/extracao_resumo.json"]
    mem_gb: 1
    cpus: 1
    tempo_estimado: "~10 s"
  - key: frequencias_demo
    titulo: "Frequências alélicas (demo)"
    descricao: Tabela AF/MAF das variantes extraídas, ordenada por MAF (INFO AF do Run 8).
    runtime: "image:omica-bioinfo"
    cmd: >-
      python3 modules/genomica/scripts/frequencias.py
      --entrada {dados}/results/genomica/demo/extracao/extraido.vcf.gz
      --saida {dados}/results/genomica/demo/frequencias
    inputs: ["results/genomica/demo/extracao/extraido.vcf.gz"]
    outputs: ["results/genomica/demo/frequencias/frequencias.tsv", "results/genomica/demo/frequencias/frequencias_resumo.json"]
    mem_gb: 1
    cpus: 1
    tempo_estimado: "~10 s"
  - key: anotacao_demo
    titulo: "Anotação SnpEff (demo)"
    descricao: Anota as variantes extraídas com o banco custom ARS-UCD1.3.113 e conta efeitos.
    runtime: "image:omica-bioinfo"
    cmd: >-
      python3 modules/genomica/scripts/anotacao_snpeff.py
      --entrada {dados}/results/genomica/demo/extracao/extraido.vcf.gz
      --saida {dados}/results/genomica/demo/anotacao
    inputs: ["results/genomica/demo/extracao/extraido.vcf.gz", "E:\\data\\snpeff_data\\ARS-UCD1.3.113"]
    outputs: ["results/genomica/demo/anotacao/anotado.vcf.gz", "results/genomica/demo/anotacao/efeitos.tsv"]
    mem_gb: 5
    cpus: 2
    tempo_estimado: "1–3 min"
  - key: coordenadas_painel
    titulo: "Painel de genes → BED (GTF local)"
    descricao: >-
      Resolve as coordenadas de um painel de símbolos contra o GTF do banco SnpEff
      local (ARS-UCD1.3 — mesmo sistema dos VCFs Run 8) e gera o BED com flanco.
    runtime: "image:omica-bioinfo"
    cmd: >-
      python3 modules/genomica/scripts/coordenadas_painel.py
      --painel {painel} --pad {pad}
      --gtf /data/snpeff_data/ARS-UCD1.3.113/genes.gtf.gz
      --saida {dados}/results/genomica/paineis
    params:
      - {name: painel, rotulo: "Arquivo do painel (símbolos, 1/linha)", default: "modules/genomica/data/paineis/termotolerancia.txt"}
      - {name: pad, rotulo: "Flanco em pb (convenção painel 108: 15000)", default: "15000"}
    inputs: ["modules/genomica/data/paineis/termotolerancia.txt", "E:\\data\\snpeff_data\\ARS-UCD1.3.113\\genes.gtf.gz"]
    outputs: ["results/genomica/paineis/termotolerancia.bed", "results/genomica/paineis/termotolerancia_resumo.json"]
    mem_gb: 1
    cpus: 1
    tempo_estimado: "~20 s"
  - key: integridade_vcf
    titulo: "Integridade dos VCFs/BCFs (1000BG)"
    descricao: Índice presente, header e primeiro registro legíveis, arquivo a arquivo.
    runtime: "image:omica-bioinfo"
    cmd: >-
      python3 modules/genomica/scripts/integridade_vcf.py
      --dir {dir_vcf} --saida {dados}/results/genomica/integridade
    params:
      - {name: dir_vcf, rotulo: "Diretório dos VCFs/BCFs", default: "/data/1000bg_vcf"}
    inputs: ["E:\\data\\1000bg_vcf"]
    outputs: ["results/genomica/integridade/integridade.tsv", "results/genomica/integridade/integridade_resumo.json"]
    mem_gb: 1
    cpus: 1
    tempo_estimado: "~1 min"
  - key: fst_racas
    titulo: "Fst por raça (Angus × Nelore, plink2)"
    descricao: >-
      Fst de Hudson por variante e global entre duas raças, com as listas reais de
      BioSamples do 1000BG (interseção reportada no log).
    runtime: "image:omica-bioinfo"
    cmd: >-
      python3 modules/genomica/scripts/fst_racas.py
      --vcf {vcf} --regiao {regiao}
      --grupo-a {grupo_a} --grupo-b {grupo_b}
      --saida {dados}/results/genomica/fst
    params:
      - {name: vcf, rotulo: "VCF/BCF com genótipos", default: "/data/1000bg_vcf/Chr14-Run8-TAUIND-public.bcf"}
      - {name: regiao, rotulo: "Região (crom:ini-fim)", default: "14:1-2500000"}
      - {name: grupo_a, rotulo: "Grupo A (Nome=lista)", default: "Angus=/data/1000bg_metadata/samples_angus.txt"}
      - {name: grupo_b, rotulo: "Grupo B (Nome=lista)", default: "Nelore=/data/1000bg_metadata/samples_nelore.txt"}
    inputs: ["E:\\data\\1000bg_vcf", "E:\\data\\1000bg_metadata\\samples_angus.txt", "E:\\data\\1000bg_metadata\\samples_nelore.txt"]
    outputs: ["results/genomica/fst/fst_top.tsv", "results/genomica/fst/fst_resumo.json"]
    mem_gb: 4
    cpus: 2
    tempo_estimado: "1–3 min"
  - key: vep_demo
    titulo: "Anotação VEP (demo)"
    descricao: >-
      Ensembl VEP offline sobre as variantes extraídas — release 110 PINADO
      (último com bos_taurus em ARS-UCD1.2; o atual usa ARS-UCD2.0).
    runtime: "image:omica-vep"
    cmd: >-
      python3 modules/genomica/scripts/vep_anotacao.py
      --entrada {dados}/results/genomica/demo/extracao/extraido.vcf.gz
      --saida {dados}/results/genomica/demo/vep
    inputs: ["results/genomica/demo/extracao/extraido.vcf.gz", "E:\\data\\omica\\refs\\vep\\bos_taurus"]
    outputs: ["results/genomica/demo/vep/vep_resumo.json", "results/genomica/demo/vep/efeitos_vep.tsv"]
    mem_gb: 4
    cpus: 1
    tempo_estimado: "2–5 min"
workflows:
  - id: wf_painel_demo
    titulo: "Do painel ao efeito funcional (demo BTA14)"
    descricao: >-
      Extração das variantes do painel demo → frequências AF/MAF → anotação
      funcional SnpEff. Cada passo consome o arquivo de saída do anterior.
    passos: [extracao_demo, frequencias_demo, anotacao_demo]
    testado_em: "2026-09-02"
    testado_por: "Claude (fila real: 52.881 variantes → 41 efeitos distintos)"
    hash_scripts: "220c3f92838d7e83"
    nota_didatica: >-
      O mesmo desenho vale para um painel real: troque o BED demo pelo BED gerado
      em "Painel de genes → BED" e o restante do fluxo não muda.
results_spec:
  "Extração (resumo)": "genomica/demo/extracao/extracao_resumo.json"
  "Frequências (resumo)": "genomica/demo/frequencias/frequencias_resumo.json"
  "Frequências (top MAF)": "genomica/demo/frequencias/frequencias.tsv"
  "Anotação (resumo)": "genomica/demo/anotacao/anotacao_resumo.json"
  "Anotação (efeitos)": "genomica/demo/anotacao/efeitos.tsv"
  "Painel termotolerância (resumo)": "genomica/paineis/termotolerancia_resumo.json"
  "Integridade 1000BG (resumo)": "genomica/integridade/integridade_resumo.json"
  "Integridade 1000BG (tabela)": "genomica/integridade/integridade.tsv"
  "Fst Angus×Nelore (resumo)": "genomica/fst/fst_resumo.json"
  "Fst Angus×Nelore (top)": "genomica/fst/fst_top.tsv"
  "VEP (resumo)": "genomica/demo/vep/vep_resumo.json"
  "VEP (consequências)": "genomica/demo/vep/efeitos_vep.tsv"
